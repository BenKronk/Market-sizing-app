<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Obtainable-Share Sizer — Break-even</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#0B111A; --panel:#121B27; --panel-2:#182333; --line:#26323F; --line-soft:#1D2733;
    --text:#EAEEF3; --muted:#8B96A4; --faint:#5C6773;
    --amber:#E7A94A; --amber-2:#F2C170; --amber-glow:rgba(231,169,74,0.30);
    --green:#5FB98E; --coral:#E0705C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--text);font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;}
  #root{min-height:100vh;}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1120px;margin:0 auto;padding:44px 24px 72px;}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.28em;color:var(--amber);text-transform:uppercase;margin-bottom:14px;}
  .title{font-family:"Instrument Serif",serif;font-size:52px;line-height:1.02;font-weight:400;margin:0;letter-spacing:.2px;}
  .title em{font-style:italic;color:var(--amber-2);}
  .lede{color:var(--muted);font-size:15px;line-height:1.55;max-width:600px;margin:16px 0 0;}
  .rule{height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:36px 0 30px;}
  .grid{display:grid;grid-template-columns:0.82fr 1.18fr;gap:26px;align-items:start;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;}
  .card+.card{margin-top:20px;}
  .card-eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:18px;}
  .field{margin-bottom:20px;}
  .field:last-child{margin-bottom:0;}
  .field-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .field-label{font-size:13px;font-weight:500;color:var(--text);}
  .field-hint{font-size:11px;color:var(--faint);font-family:"IBM Plex Mono",monospace;}
  input[type="number"]{width:100%;padding:11px 13px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-family:"IBM Plex Mono",monospace;font-size:15px;outline:none;transition:border-color .15s;}
  input[type="number"]:focus{border-color:var(--amber);}
  .num-echo{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--amber);margin-top:6px;}
  input[type="range"]{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:var(--line);outline:none;cursor:pointer;}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--amber);border:2px solid var(--ink);box-shadow:0 0 0 1px var(--amber);transition:transform .12s;}
  input[type="range"]::-webkit-slider-thumb:hover{transform:scale(1.18);}
  input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--amber);border:2px solid var(--ink);}
  input[type="range"]:focus-visible{outline:2px solid var(--amber);outline-offset:4px;}
  .slider-row{display:flex;align-items:center;gap:13px;}
  .slider-row input[type="range"]{flex:1;}
  .slider-val{font-family:"IBM Plex Mono",monospace;font-size:13px;min-width:52px;text-align:right;color:var(--text);}
  .share-row{display:flex;align-items:center;gap:9px;}
  .share-idx{font-size:11px;color:var(--faint);width:15px;font-family:"IBM Plex Mono",monospace;}
  .share-pct{font-family:"IBM Plex Mono",monospace;font-size:12.5px;width:38px;text-align:right;}
  .share-x{border:none;background:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:0 3px;transition:color .12s;}
  .share-x:hover{color:var(--coral);}
  .add-btn{margin-top:11px;font-size:12px;color:var(--amber);background:rgba(231,169,74,0.09);border:1px solid rgba(231,169,74,0.28);border-radius:7px;padding:6px 12px;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;transition:background .15s;}
  .add-btn:hover{background:rgba(231,169,74,0.16);}
  .warn-line{font-size:11.5px;color:var(--coral);margin-top:9px;}
  .note-line{font-size:11px;color:var(--faint);margin-top:8px;line-height:1.5;}
  .export-bar{display:flex;gap:9px;justify-content:flex-end;margin-bottom:18px;align-items:center;flex-wrap:wrap;}
  .exp-btn{font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;transition:border-color .15s,color .15s;}
  .exp-btn:hover{border-color:var(--amber);color:var(--amber-2);}
  .exp-btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px;}
  .exp-msg{font-size:11.5px;font-family:"IBM Plex Mono",monospace;margin-right:auto;}
  .hero-label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;}
  .hero-figure{font-family:"IBM Plex Mono",monospace;font-size:52px;font-weight:600;line-height:1;color:var(--amber);text-shadow:0 0 30px var(--amber-glow);}
  .hero-sub{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5;}
  .verdict{font-size:13.5px;margin-top:16px;font-weight:500;line-height:1.5;padding:12px 14px;border-radius:9px;border:1px solid;}
  .chart-wrap{width:100%;}
  .interval{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);margin-top:14px;}
  .interval b{color:var(--text);}
  .market-bar{display:flex;height:22px;border-radius:7px;overflow:hidden;border:1px solid var(--line);}
  .market-seg{height:100%;transition:width .4s cubic-bezier(.2,.7,.2,1);}
  .market-tail{height:100%;background-image:repeating-linear-gradient(45deg,#223040 0 6px,#1a2634 6px 12px);}
  .market-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);}
  .legend-item{display:flex;align-items:center;gap:6px;}
  .legend-dot{width:9px;height:9px;border-radius:2px;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:22px;}
  .stat{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;padding:12px 13px;}
  .stat-label{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:5px;}
  .stat-val{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;}
  .equation{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-top:22px;}
  .footnote{font-size:11.5px;color:var(--faint);line-height:1.65;margin-top:24px;}
  .footnote i{color:var(--muted);}
  @media (max-width:900px){.grid{grid-template-columns:1fr;}.title{font-size:40px;}.stats{grid-template-columns:repeat(2,1fr);}}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;
const SEG_COLORS=["#4B6076","#42576B","#3A4D60","#334354","#2C3A49","#26323F"];

const money=(n)=>{ if(!isFinite(n))return "-"; const a=Math.abs(n);
  if(a>=1e9)return "$"+(n/1e9).toFixed(2)+"B"; if(a>=1e6)return "$"+(n/1e6).toFixed(1)+"M";
  if(a>=1e3)return "$"+(n/1e3).toFixed(0)+"K"; return "$"+n.toFixed(0); };
const moneyAx=(n)=>{ const a=Math.abs(n);
  if(a>=1e9)return "$"+(n/1e9).toFixed(1)+"B"; if(a>=1e6)return "$"+Math.round(n/1e6)+"M";
  if(a>=1e3)return "$"+Math.round(n/1e3)+"K"; return "$"+Math.round(n); };
const pct=(x,d=1)=>isFinite(x)?(x*100).toFixed(d)+"%":"-";

// ---- model ----
const bassF=(p,q,t)=>{ const e=Math.exp(-(p+q)*t); return (1-e)/(1+(q/p)*e); };
const shareOfR=(r,Neff)=> isFinite(Neff)? r/(Neff+r) : 0;
const somOf=(r,SAM,Neff,F)=> SAM*shareOfR(r,Neff)*F;

function Field({label,hint,children}){
  return (<div className="field"><div className="field-head"><span className="field-label">{label}</span>
    {hint&&<span className="field-hint">{hint}</span>}</div>{children}</div>);
}
function Slider({value,min,max,step,onChange,fmt}){
  return (<div className="slider-row"><input type="range" min={min} max={max} step={step} value={value}
    onChange={(e)=>onChange(parseFloat(e.target.value))}/><span className="slider-val">{fmt(value)}</span></div>);
}

function Chart({SAM,Neff,F,target,rLow,rHigh,rStar,reachable,tone}){
  const W=620,H=240,PADL=54,PADR=16,PADT=16,PADB=34;
  const x0=PADL, x1=W-PADR, y0=H-PADB, yTop=PADT;
  const plotW=x1-x0, plotH=y0-yTop;
  const ceiling=SAM*F;
  let rMax=Math.max(3, Math.ceil(rHigh*1.3), reachable&&isFinite(rStar)?Math.ceil(rStar*1.3):0);
  rMax=Math.min(rMax,8);
  const yMax=Math.max(ceiling,target)*1.06 || 1;
  const xS=(r)=>x0+(r/rMax)*plotW;
  const yS=(v)=>y0-(Math.min(v,yMax)/yMax)*plotH;

  const pts=[]; const N=64;
  for(let i=0;i<=N;i++){ const r=rMax*i/N; pts.push([xS(r), yS(somOf(r,SAM,Neff,F))]); }
  const line="M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L");
  const area=line+" L"+xS(rMax).toFixed(1)+","+y0+" L"+x0+","+y0+" Z";

  const xticks=[]; for(let k=0;k<=rMax;k++) xticks.push(k);
  const somLow=somOf(rLow,SAM,Neff,F), somHigh=somOf(rHigh,SAM,Neff,F);

  return (
   <svg viewBox={"0 0 "+W+" "+H} width="100%" style={{display:"block"}} role="img" aria-label="SOM versus relative attractiveness">
     {/* plausible-r band */}
     <rect x={xS(rLow)} y={yTop} width={Math.max(0,xS(rHigh)-xS(rLow))} height={plotH} fill="rgba(139,150,164,0.10)"/>
     {/* ceiling line */}
     <line x1={x0} y1={yS(ceiling)} x2={x1} y2={yS(ceiling)} stroke="#2C3A49" strokeWidth="1" strokeDasharray="2 3"/>
     <text x={x1} y={yS(ceiling)-5} textAnchor="end" fontFamily="IBM Plex Mono" fontSize="9" fill="#5C6773">ceiling {moneyAx(ceiling)}</text>
     {/* area + curve */}
     <path d={area} fill="rgba(231,169,74,0.08)"/>
     <path d={line} fill="none" stroke="#E7A94A" strokeWidth="2"/>
     {/* target line */}
     <line x1={x0} y1={yS(target)} x2={x1} y2={yS(target)} stroke="#E7A94A" strokeWidth="1.2" strokeDasharray="5 4" opacity="0.8"/>
     <text x={x0+4} y={yS(target)-5} fontFamily="IBM Plex Mono" fontSize="9.5" fill="#E7A94A">target {moneyAx(target)}</text>
     {/* break-even marker */}
     {reachable&&isFinite(rStar)&&rStar<=rMax&&(
       <g>
         <line x1={xS(rStar)} y1={y0} x2={xS(rStar)} y2={yS(target)} stroke={tone} strokeWidth="1.5"/>
         <circle cx={xS(rStar)} cy={yS(target)} r="4" fill={tone}/>
         <text x={xS(rStar)} y={yS(target)-9} textAnchor="middle" fontFamily="IBM Plex Mono" fontSize="10" fill={tone}>r*={rStar.toFixed(2)}</text>
       </g>
     )}
     {/* plausible endpoints */}
     <circle cx={xS(rLow)} cy={yS(somLow)} r="3.2" fill="#8B96A4"/>
     <circle cx={xS(rHigh)} cy={yS(somHigh)} r="3.2" fill="#8B96A4"/>
     {/* axes */}
     <line x1={x0} y1={y0} x2={x1} y2={y0} stroke="#26323F" strokeWidth="1"/>
     {xticks.map(k=>(
       <g key={k}>
         <line x1={xS(k)} y1={y0} x2={xS(k)} y2={y0+4} stroke="#3A4A5E" strokeWidth="1"/>
         <text x={xS(k)} y={y0+16} textAnchor="middle" fontFamily="IBM Plex Mono" fontSize="9.5"
           fill={k===1?"#E7A94A":"#5C6773"}>{k===1?"1x par":(k+"x")}</text>
       </g>
     ))}
     <text x={(x0+x1)/2} y={H-3} textAnchor="middle" fontFamily="IBM Plex Mono" fontSize="9.5" fill="#5C6773">relative attractiveness  r  (x average incumbent)</text>
     <text x={12} y={(yTop+y0)/2} textAnchor="middle" fontFamily="IBM Plex Mono" fontSize="9.5" fill="#5C6773" transform={"rotate(-90 12 "+((yTop+y0)/2)+")"}>SOM at horizon</text>
   </svg>
  );
}

function App(){
  const [sam,setSam]=useState(8000000000);
  const [shares,setShares]=useState([42,21,12,6]);
  const [target,setTarget]=useState(200000000);
  const [t,setT]=useState(3);
  const [p,setP]=useState(0.03);
  const [q,setQ]=useState(0.38);
  const [rLow,setRLow]=useState(0.5);
  const [rHigh,setRHigh]=useState(2.0);
  const [expMsg,setExpMsg]=useState({text:"",tone:"var(--faint)"});

  const d=useMemo(()=>{
    const clean=shares.filter(s=>s>0);
    const sum=clean.reduce((a,b)=>a+b,0);
    const hhiFrac=clean.reduce((a,s)=>a+(s/100)*(s/100),0);
    const hhi=hhiFrac*10000;
    const Neff=hhiFrac>0?1/hhiFrac:Infinity;
    const cr4=[...clean].sort((a,b)=>b-a).slice(0,4).reduce((a,b)=>a+b,0);
    let conc="Unconcentrated"; if(hhi>=2500)conc="Highly concentrated"; else if(hhi>=1500)conc="Moderately concentrated";
    const F=bassF(p,q,t);
    const ceiling=sam*F;
    const sReq=target/(sam*F);
    const reachable=sReq<1 && isFinite(Neff);
    const rStar=reachable? sReq*Neff/(1-sReq) : Infinity;
    const somLow=somOf(rLow,sam,Neff,F), somHigh=somOf(rHigh,sam,Neff,F);
    let tone="#5FB98E", verdict="";
    if(!isFinite(Neff)){ tone="#E0705C"; verdict="Add at least one competitor share — the effective-firm count drives the whole estimate."; }
    else if(!reachable){ tone="#E0705C"; verdict="Target exceeds the served-at-horizon ceiling ("+money(ceiling)+" = SAM x adoption-to-date). Not reachable by share capture by year "+t+" — extend the horizon or lower the target."; }
    else if(rStar<=rLow){ tone="#5FB98E"; verdict="Reachable across your whole plausible range — even the low end (r "+rLow.toFixed(1)+") clears the target."; }
    else if(rStar>=rHigh){ tone="#E0705C"; verdict="Requires r* = "+rStar.toFixed(2)+", above your plausible ceiling (r "+rHigh.toFixed(1)+"). On these inputs the target reads as overclaiming."; }
    else { tone="#E7A94A"; verdict="The target hinges on being at least "+rStar.toFixed(2)+"x as attractive as the average incumbent. That judgment is the crux of the case."; }
    const toneKey = tone==="#5FB98E"?"green":tone==="#E0705C"?"coral":"amber";
    return {clean,sum,hhi,Neff,cr4,conc,F,ceiling,sReq,reachable,rStar,somLow,somHigh,tone,toneKey,verdict};
  },[sam,shares,target,t,p,q,rLow,rHigh]);

  const setShare=(i,v)=>setShares(pr=>pr.map((s,idx)=>idx===i?v:s));
  const addShare=()=>setShares(pr=>[...pr,5]);
  const rmShare=(i)=>setShares(pr=>pr.filter((_,idx)=>idx!==i));
  const chgLow=(v)=>{ setRLow(Math.min(v,rHigh)); };
  const chgHigh=(v)=>{ setRHigh(Math.max(v,rLow)); };
  const stamp=()=>new Date().toISOString().slice(0,10);

  const exportXlsx=()=>{
    if(typeof XLSX==="undefined"){ setExpMsg({text:"Spreadsheet library didn't load - reconnect and reopen.",tone:"var(--coral)"}); return; }
    try{
      const rows=[
        ["Obtainable-Share Break-even Estimate",""],["Generated",stamp()],["",""],
        ["INPUTS",""],
        ["Serviceable available market (SAM), $",sam],
        ["Target obtainable market, $",target],
        ["Horizon, years",t],
        ["Bass p (innovation)",p],["Bass q (imitation)",q],
        ["Adoption to horizon F(t)",Number(d.F.toFixed(4))],
        ["Plausible attractiveness low (r)",rLow],["Plausible attractiveness high (r)",rHigh],
        ["",""],
        ["MARKET CONCENTRATION",""],
        ["HHI",isFinite(d.hhi)?Math.round(d.hhi):""],["Structure",d.conc],
        ["CR4, %",d.cr4],["Effective # of firms",isFinite(d.Neff)?Number(d.Neff.toFixed(2)):""],
        ["",""],
        ["RESULT",""],
        ["Served-at-horizon ceiling (SAM x F), $",Math.round(d.ceiling)],
        ["Required long-run share for target, %",Number((d.sReq*100).toFixed(2))],
        ["Break-even attractiveness r*",d.reachable?Number(d.rStar.toFixed(3)):"unreachable"],
        ["SOM at r_low, $",Math.round(d.somLow)],["SOM at r_high, $",Math.round(d.somHigh)],
        ["Verdict",d.verdict],
        ["",""],
        ["Model","SOM(t) = SAM x [ r / (N_eff + r) ] x F_Bass(t; p,q)"],
        ["Basis","Share form: Bell-Keeney-Little attraction theorem (1975). Adoption: Bass (1969); p,q benchmark Sultan-Farley-Lehmann (1990)."],
        ["Note","r (relative attractiveness) is a judgment input; no model removes it. Bass tends to overestimate early years."]
      ];
      const ws1=XLSX.utils.aoa_to_sheet(rows); ws1["!cols"]=[{wch:46},{wch:60}];
      const comp=[["Competitor","Share, %"]].concat(d.clean.map((s,i)=>["Competitor "+(i+1),s]));
      comp.push(["Fragmented / unaccounted",Math.max(0,100-d.sum)]);
      const ws2=XLSX.utils.aoa_to_sheet(comp); ws2["!cols"]=[{wch:26},{wch:12}];
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws1,"Break-even"); XLSX.utils.book_append_sheet(wb,ws2,"Competitors");
      XLSX.writeFile(wb,"obtainable-share-breakeven_"+stamp()+".xlsx");
      setExpMsg({text:"Spreadsheet downloaded.",tone:"var(--green)"});
    }catch(e){ setExpMsg({text:"Export failed: "+e.message,tone:"var(--coral)"}); }
  };

  const exportPdf=()=>{
    const J=window.jspdf&&window.jspdf.jsPDF;
    if(!J){ setExpMsg({text:"PDF library didn't load - reconnect and reopen.",tone:"var(--coral)"}); return; }
    try{
      const doc=new J({unit:"pt",format:"letter"});
      const M=56; let y=64; const W=doc.internal.pageSize.getWidth();
      const amber=[199,138,40], ink=[26,29,36], muted=[110,120,133], coral=[176,69,60], green=[45,125,87];
      const tc = d.toneKey==="green"?green : d.toneKey==="coral"?coral : amber;
      doc.setFont("courier","normal");doc.setFontSize(9);doc.setTextColor.apply(doc,amber);
      doc.text("COMPETITIVE-INTENSITY SIZER",M,y); y+=26;
      doc.setFont("times","normal");doc.setFontSize(24);doc.setTextColor.apply(doc,ink);
      doc.text("Obtainable-Share Break-even",M,y); y+=17;
      doc.setFont("courier","normal");doc.setFontSize(9);doc.setTextColor.apply(doc,muted);
      doc.text("Generated "+stamp(),M,y); y+=30;
      doc.setFont("courier","bold");doc.setFontSize(28);doc.setTextColor.apply(doc,amber);
      doc.text(d.reachable? d.rStar.toFixed(2)+"x" : "unreachable", M, y);
      doc.setFont("courier","normal");doc.setFontSize(10);doc.setTextColor.apply(doc,muted);
      doc.text("break-even attractiveness to reach "+money(target)+" by year "+t, M, y+16); y+=40;
      doc.setDrawColor(210,214,220);doc.line(M,y,W-M,y); y+=20;
      const rowf=(l,v)=>{doc.setFont("courier","normal");doc.setFontSize(10);doc.setTextColor.apply(doc,muted);
        doc.text(l,M,y); doc.setTextColor.apply(doc,ink); doc.text(String(v),W-M,y,{align:"right"}); y+=17;};
      const head=(tt)=>{y+=6;doc.setFont("courier","bold");doc.setFontSize(9);doc.setTextColor.apply(doc,amber);doc.text(tt,M,y);y+=15;};
      head("INPUTS");
      rowf("SAM",money(sam)); rowf("Target obtainable market",money(target));
      rowf("Horizon",t+" yr"); rowf("Bass p / q",p.toFixed(3)+" / "+q.toFixed(2));
      rowf("Adoption to horizon F(t)",(d.F*100).toFixed(1)+"%");
      rowf("Plausible attractiveness r",rLow.toFixed(1)+" to "+rHigh.toFixed(1));
      head("MARKET");
      rowf("HHI",isFinite(d.hhi)?Math.round(d.hhi).toLocaleString():"-");
      rowf("Structure",d.conc); rowf("CR4",d.cr4.toFixed(0)+"%");
      rowf("Effective # of firms",isFinite(d.Neff)?d.Neff.toFixed(1):"-");
      head("RESULT");
      rowf("Served-at-horizon ceiling",money(d.ceiling));
      rowf("Required long-run share",(d.sReq*100).toFixed(2)+"%");
      rowf("SOM across plausible r",money(d.somLow)+" to "+money(d.somHigh));
      y+=6; doc.setFont("courier","bold");doc.setFontSize(9);doc.setTextColor.apply(doc,tc);
      doc.text("VERDICT",M,y); y+=14;
      doc.setFont("times","normal");doc.setFontSize(10);doc.setTextColor.apply(doc,ink);
      doc.text(doc.splitTextToSize(d.verdict,W-2*M),M,y);
      y+= doc.splitTextToSize(d.verdict,W-2*M).length*13 + 14;
      doc.setDrawColor(210,214,220);doc.line(M,y,W-M,y); y+=16;
      doc.setFont("times","italic");doc.setFontSize(8.5);doc.setTextColor.apply(doc,muted);
      const note="Model: SOM(t) = SAM x [ r / (N_eff + r) ] x F_Bass(t). Share form from the Bell-Keeney-Little attraction theorem (1975); adoption from Bass (1969) with p,q benchmarked to Sultan-Farley-Lehmann (1990). r, relative attractiveness versus the average incumbent, is a judgment input - no model removes it; the tool reports the r you would need, not a number it can supply. Bass tends to overestimate early years, and the attraction form assumes you compete for the same customers on substitutable terms.";
      doc.text(doc.splitTextToSize(note,W-2*M),M,y);
      doc.save("obtainable-share-breakeven_"+stamp()+".pdf");
      setExpMsg({text:"PDF downloaded.",tone:"var(--green)"});
    }catch(e){ setExpMsg({text:"Export failed: "+e.message,tone:"var(--coral)"}); }
  };

  const segs=[...shares].filter(s=>s>0).sort((a,b)=>b-a);
  const tail=Math.max(0,100-segs.reduce((a,b)=>a+b,0));

  return (
   <div className="wrap">
     <div className="eyebrow">Competitive-Intensity Sizer</div>
     <h1 className="title">How <em>attractive</em> would you have to be?</h1>
     <p className="lede">A point estimate hides the guess inside it. This works backward: given the market's
       concentration and a real adoption curve, it finds the relative attractiveness you'd need to hit your target —
       then leaves you to judge whether that's believable.</p>
     <div className="rule"></div>

     <div className="grid">
       <div>
         <div className="card">
           <div className="card-eyebrow">The market</div>
           <Field label="Serviceable available market" hint="annual, $">
             <input type="number" value={sam} onChange={(e)=>setSam(parseFloat(e.target.value)||0)}/>
             <div className="num-echo">{money(sam)}</div>
           </Field>
           <Field label="Competitor shares" hint={"entered: "+d.sum+"%"}>
             <div style={{display:"flex",flexDirection:"column",gap:8}}>
               {shares.map((s,i)=>(
                 <div className="share-row" key={i}>
                   <span className="share-idx">{i+1}</span>
                   <input type="range" min={0} max={100} step={1} value={s} onChange={(e)=>setShare(i,parseFloat(e.target.value))} style={{flex:1}}/>
                   <span className="share-pct">{s}%</span>
                   <button className="share-x" onClick={()=>rmShare(i)} aria-label={"Remove competitor "+(i+1)}>x</button>
                 </div>
               ))}
             </div>
             <button className="add-btn" onClick={addShare}>+ Add competitor</button>
             {d.sum>100&&<div className="warn-line">Shares sum above 100% - HHI is inflated. Trim to real shares.</div>}
           </Field>
         </div>

         <div className="card">
           <div className="card-eyebrow">Target & adoption</div>
           <Field label="Target obtainable market" hint="what you want to defend, $">
             <input type="number" value={target} onChange={(e)=>setTarget(parseFloat(e.target.value)||0)}/>
             <div className="num-echo">{money(target)}</div>
           </Field>
           <Field label="Horizon" hint="years">
             <Slider value={t} min={1} max={10} step={1} onChange={setT} fmt={v=>v+" yr"}/>
           </Field>
           <Field label="Adoption speed - Bass p" hint="innovation">
             <Slider value={p} min={0.005} max={0.08} step={0.005} onChange={setP} fmt={v=>v.toFixed(3)}/>
           </Field>
           <Field label="Adoption speed - Bass q" hint="imitation">
             <Slider value={q} min={0.10} max={0.60} step={0.01} onChange={setQ} fmt={v=>v.toFixed(2)}/>
           </Field>
           <div className="note-line">Benchmark p 0.03 / q 0.38 is the Sultan-Farley-Lehmann meta-analysis average across 213 products. Other categories differ - adjust. Adoption to horizon: <span className="mono" style={{color:"var(--amber)"}}>{(d.F*100).toFixed(1)}%</span>.</div>
         </div>

         <div className="card">
           <div className="card-eyebrow">Plausible attractiveness</div>
           <div className="note-line" style={{marginTop:0,marginBottom:14}}>r = how attractive your offering is versus the <i>average</i> incumbent. 1.0 = at par. Set the range you'd actually defend; the tool shows where the break-even falls inside it.</div>
           <Field label="Low end" hint="r, x avg incumbent">
             <Slider value={rLow} min={0.2} max={4} step={0.1} onChange={chgLow} fmt={v=>v.toFixed(1)+"x"}/>
           </Field>
           <Field label="High end" hint="r, x avg incumbent">
             <Slider value={rHigh} min={0.2} max={4} step={0.1} onChange={chgHigh} fmt={v=>v.toFixed(1)+"x"}/>
           </Field>
         </div>
       </div>

       <div>
         <div className="card">
           <div className="export-bar">
             {expMsg.text&&<span className="exp-msg" style={{color:expMsg.tone}}>{expMsg.text}</span>}
             <button className="exp-btn" onClick={exportXlsx}>Download .xlsx</button>
             <button className="exp-btn" onClick={exportPdf}>Download .pdf</button>
           </div>
           <div className="hero-label">Break-even attractiveness</div>
           <div className="hero-figure">{d.reachable? d.rStar.toFixed(2)+"x" : "—"}</div>
           <div className="hero-sub">{d.reachable
             ? "You'd need to be about "+d.rStar.toFixed(2)+"x as attractive as the average incumbent to reach "+money(target)+" by year "+t+"."
             : "No attractiveness reaches "+money(target)+" by year "+t+" — it's past the served-at-horizon ceiling."}</div>
           <div className="verdict" style={{color:d.tone,borderColor:d.tone,background:"rgba(255,255,255,0.02)"}}>{d.verdict}</div>
         </div>

         <div className="card">
           <div className="card-eyebrow">Sensitivity — SOM vs relative attractiveness</div>
           <div className="chart-wrap">
             <Chart SAM={sam} Neff={d.Neff} F={d.F} target={target} rLow={rLow} rHigh={rHigh} rStar={d.rStar} reachable={d.reachable} tone={d.tone}/>
           </div>
           <div className="interval">Across your plausible range (r {rLow.toFixed(1)}x–{rHigh.toFixed(1)}x), SOM by year {t}: <b>{money(d.somLow)}</b> to <b>{money(d.somHigh)}</b>.</div>
         </div>

         <div className="card">
           <div className="card-eyebrow">Market structure</div>
           <div className="market-bar">
             {segs.map((s,i)=>(<div className="market-seg" key={i} style={{width:s+"%",background:SEG_COLORS[i%SEG_COLORS.length]}} title={"Competitor "+(i+1)+": "+s+"%"}></div>))}
             {tail>0&&<div className="market-tail" style={{width:tail+"%"}} title={"Fragmented: "+tail+"%"}></div>}
           </div>
           <div className="market-legend">
             <span className="legend-item"><span className="legend-dot" style={{background:SEG_COLORS[0]}}></span>ranked competitors</span>
             {tail>0&&<span className="legend-item"><span className="legend-dot" style={{backgroundImage:"repeating-linear-gradient(45deg,#223040 0 3px,#1a2634 3px 6px)"}}></span>fragmented tail {tail}%</span>}
           </div>
           <div className="stats">
             <div className="stat"><div className="stat-label">HHI</div><div className="stat-val">{isFinite(d.hhi)?Math.round(d.hhi).toLocaleString():"-"}</div></div>
             <div className="stat"><div className="stat-label">Structure</div><div className="stat-val" style={{fontSize:13,color:d.hhi>=2500?"var(--amber)":"var(--text)"}}>{d.conc}</div></div>
             <div className="stat"><div className="stat-label">CR4</div><div className="stat-val">{d.cr4.toFixed(0)}%</div></div>
             <div className="stat"><div className="stat-label">Eff. firms</div><div className="stat-val">{isFinite(d.Neff)?d.Neff.toFixed(1):"-"}</div></div>
           </div>
           <div className="equation">SOM(t) = SAM x [ r / (N_eff + r) ] x F<sub>Bass</sub>(t)</div>
         </div>

         <p className="footnote">
           Share form from the <i>Bell-Keeney-Little attraction theorem</i> (1975): share = a firm's attraction / total
           attraction. Incumbent attraction is read from observed share; N_eff = 1/HHI. Adoption from the <i>Bass model</i>
           (1969), p/q benchmarked to Sultan-Farley-Lehmann (1990). The one input no model can supply is r, your
           attractiveness versus the average incumbent — so the tool reports the r you'd <i>need</i>, not a number it
           invents. Two honest limits: Bass overestimates early years, and the attraction form assumes you compete for the
           same customers on substitutable terms.
         </p>
       </div>
     </div>
   </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
